name: Release new docker image containing the base environment

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the released image to docker registry (yes or no, default no)"
      channel:
        description: "Release channel"
        type: choice
        options:
          - production
          - staging
        default: production
      fem_on_colab_branch:
        description: "Branch to be used in the FEM on Colab repository (default main)"
  workflow_call:
    inputs:
      push:
        description: "Push the released image to docker registry (yes or no, default no)"
        type: string
      channel:
        description: "Release channel"
        type: string
        default: production
      fem_on_colab_branch:
        description: "Branch to be used in the FEM on Colab repository (default main)"
        type: string

env:
  IMAGE_PREFIX: ghcr.io/fem-on-kaggle/base
  IMAGE_CHANNEL_TAG: ${{ inputs.channel == 'staging' && 'staging' || 'latest' }}
  IMAGE_COMPATIBILITY_TAG_PREFIX: ${{ inputs.channel == 'staging' && 'staging-' || '' }}

jobs:
  extract-backend-info:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c  # v10
        with:
          overprovision-lvm: 'true'
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: Determine backend info from an actual kaggle image
        run: |
          KAGGLE_IMAGE=gcr.io/kaggle-images/python
          KAGGLE_IMAGE_TAG=latest
          sudo cp -rf /var/lib/docker /mnt/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/
          sudo systemctl restart docker
          docker pull ${KAGGLE_IMAGE}:${KAGGLE_IMAGE_TAG}
          docker run --rm ${KAGGLE_IMAGE}:${KAGGLE_IMAGE_TAG} apt list --installed > apt-list.txt
          docker run --rm ${KAGGLE_IMAGE}:${KAGGLE_IMAGE_TAG} python3 -m pip freeze > pip-freeze.txt
          docker run --rm ${KAGGLE_IMAGE}:${KAGGLE_IMAGE_TAG} bash -c 'echo ${GIT_COMMIT}' > git-commit.txt
          docker rmi $(docker images ${KAGGLE_IMAGE} -a -q)
        shell: bash
      - name: Store backend info as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-info
          path: |
            apt-list.txt
            pip-freeze.txt
            git-commit.txt

  release:
    runs-on: ubuntu-latest
    needs: [extract-backend-info]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Determine whether to push the released image to docker registry
        id: push
        run: |
          PUSH=${{ (inputs || github.event.inputs).push }}
          if [[ "${PUSH}" == "yes" ]]; then
            echo "push=yes" >> ${GITHUB_OUTPUT}
          else
            echo "push=no" >> ${GITHUB_OUTPUT}
          fi
        shell: bash
      - name: Determine the branch to be used in the FEM on Colab repository
        id: fem_on_colab_branch
        run: |
          FEM_ON_COLAB_BRANCH=${{ (inputs || github.event.inputs).fem_on_colab_branch }}
          if [[ "${FEM_ON_COLAB_BRANCH}" == "" ]]; then
            echo "fem_on_colab_branch=main" >> ${GITHUB_OUTPUT}
          else
            echo "fem_on_colab_branch=${FEM_ON_COLAB_BRANCH}" >> ${GITHUB_OUTPUT}
          fi
        shell: bash
      - name: Download backend info from artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      - name: Build docker image
        run: |
          FEM_ON_COLAB_BRANCH="${{ steps.fem_on_colab_branch.outputs.fem_on_colab_branch }}"
          docker build --pull -t ${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG} -f base/Dockerfile --build-arg FEM_ON_COLAB_BRANCH=${FEM_ON_COLAB_BRANCH} .
      - name: Print docker image size
        run: |
          SIZE=$(docker image inspect "${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG}" --format='{{.Size}}')
          echo "Final image size: $(numfmt --to=iec "$SIZE")"
      - name: Print biggest apt packages
        run: |
          docker run --rm -i "${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG}" sh -s <<'SH'
          dpkg-query -W -f='${Installed-Size}\t${Package}\n' |
            sort -nr |
            head -20 |
            awk '{printf "%.1f MB\t%s\n", $1/1024, $2}'
          SH
      - name: Print biggest pip packages
        run: |
          docker run --rm -i "${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG}" python3 - <<'PY'
          import importlib.metadata
          import os

          rows = []

          for dist in importlib.metadata.distributions():
              try:
                  size = sum(
                      os.path.getsize(dist.locate_file(f))
                      for f in (dist.files or [])
                      if os.path.isfile(dist.locate_file(f))
                  )
                  rows.append((size, dist.metadata["Name"]))
              except (OSError, TypeError):
                  pass

          for size, name in sorted(rows, reverse=True)[:20]:
              print(f"{size / 1024 / 1024:8.1f} MB  {name}")
          PY
      - name: Determine image tag
        if: github.repository == 'fem-on-kaggle/fem-on-kaggle' && steps.push.outputs.push == 'yes'
        id: image_name
        run: |
          IMAGE_TAG=$(docker run -i ${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG} bash /usr/bin/compute_docker_tag.sh)
          echo "image_tag=${IMAGE_TAG}" >> ${GITHUB_OUTPUT}
      - name: Log into the docker registry
        if: github.repository == 'fem-on-kaggle/fem-on-kaggle' && steps.push.outputs.push == 'yes'
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push to the docker registry
        if: github.repository == 'fem-on-kaggle/fem-on-kaggle' && steps.push.outputs.push == 'yes'
        run: |
          IMAGE_TAG="${{ steps.image_name.outputs.image_tag }}"
          REGISTRY_IMAGE_TAG="${IMAGE_COMPATIBILITY_TAG_PREFIX}${IMAGE_TAG}"
          docker tag ${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG} ${IMAGE_PREFIX}:${REGISTRY_IMAGE_TAG}
          docker push ${IMAGE_PREFIX}:${IMAGE_CHANNEL_TAG}
          docker push ${IMAGE_PREFIX}:${REGISTRY_IMAGE_TAG}
